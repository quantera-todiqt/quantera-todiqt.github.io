<head>
    <title>{{ site.title }}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ site.url }}{{ site.baseurl }}/assets/css/main.css" />

    <style>
        /* ToDiQT colour palette */

        body {
            background: #102A43 !important;
        }

        #sidebar {
            background: #102A43 !important;
        }

        #header {
            background-color: #16445B !important;
        }

        .wrapper.alt {
            background-color: #0B1F33 !important;
        }

        .wrapper.style1 {
            background-color: #16445B !important;
        }

        .wrapper.style1-alt {
            background-color: #12374A !important;
        }

        .wrapper.style2 {
            background-color: #1D5265 !important;
        }

        .wrapper.style2-alt {
            background-color: #174454 !important;
        }

        .wrapper.style3 {
            background-color: #287C83 !important;
        }

        .wrapper.style3-alt {
            background-color: #1E626A !important;

        h1.major:after,
        #sidebar nav a:after {

                #62D4B5

        }

        #sidebar nav a:before {
            background: #25475A !important;
        }

        a:hover {
            color: #62D4B5 !important;
        }

        .wrapper.style1 .icon.major:before,
        .wrapper.style2 .icon.major:before,
